<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our memories together</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica', sans-serif;
      background-color: #fdf6f0;
      color: #333;
      padding-bottom: 100px;
    }

    .header-container {
      position: sticky;
      top: 0;
      z-index: 11;
    }

    .black-line {
      border: none; /* Removes default border */
      height: 10px; /* Sets the thickness of the line */
      background-color: #000; /* Sets the line color to white */
      margin: 0; /* Adds some space above and below the line */
      width: 100%; /* Ensures the line spans the full width of its container */
      position: relative;
      z-index: 10;
    }

    .white-line {
      border: none; /* Removes default border */
      height: 2px; /* Sets the thickness of the line */
      background-color: #ffffff; /* Sets the line color to white */
      margin: 0; /* Adds some space above and below the line */
      width: 100%; /* Ensures the line spans the full width of its container */
      position: relative;
      z-index: 11;
    }

    h1 {
      text-align: left;
      padding: 20px;
      padding-bottom: 40px;
      background-color: #000;
      color: #fff;
      margin: 0;
      position: relative;
      z-index: 10;
    }

    .timeline-container {
      position: relative;
      width: 90%;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px 0;
    }

    /* Central line */
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 100%;
      background-color: #0039A6;
    }

    .timeline-item {
      position: relative;
      width: 50%;
      padding: 20px 40px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateX(50px);
      transition: all 0.8s ease;
    }

    .timeline-item.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .timeline-item.left {
      left: 0;
      text-align: right;
    }

    .timeline-item.right {
      left: 50%;
      text-align: left;
    }

    .timeline-item img {
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .timeline-item img:hover {
      transform: scale(1.05);
    }

    .timeline-item p {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      display: inline-block;
      max-width: 300px;
    }

    /* Circles on the line */
    .timeline-item::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border: 1px solid black;
      border-radius: 50%;
      border-color: #000;
      background-color: #fff;
      z-index: -1;
    }

    .timeline-item.left::before {
      right: -8px;
    }

    .timeline-item.right::before {
      left: -8px;
    }

    /* Lightbox modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 50;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: #fff;
      text-decoration: none;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .timeline-item {
        width: 100%;
        padding: 20px 20px;
        text-align: center;
      }
      .timeline-item.left,
      .timeline-item.right {
        left: 0;
      }
      .timeline-item.left::before,
      .timeline-item.right::before {
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .timeline-item p {
        max-width: 90%;
      }
    }

    .card-hand {
      position: relative;
      width: 600px;
      height: 360px;
      left: 50%;
      transform: translateX(-25%);
    }

    .card {
      position: absolute;
      width: 200px;
      height: 260px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      transform-origin: bottom center;
      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    /* Fan layout (centered) */
    .card:nth-child(1) {
      transform: translateX(-260px) rotate(-20deg) translateY(40px);
      z-index: 1;
    }

    .card:nth-child(2) {
      transform: translateX(-130px) rotate(-10deg) translateY(20px);
      z-index: 2;
    }

    .card:nth-child(3) {
      transform: translateX(0) rotate(0deg);
      z-index: 3;
    }

    .card:nth-child(4) {
      transform: translateX(130px) rotate(10deg) translateY(20px);
      z-index: 2;
    }

    .card:nth-child(5) {
      transform: translateX(260px) rotate(20deg) translateY(40px);
      z-index: 1;
    }

    .page-title {
      font-family: 'Helvetica', cursive;
      font-size: 30px;
      text-align: center;
      padding: 12px;
      background-color: #0039A6;
      max-width: 300px;
      color: #fff;
      margin: 0;
      position: relative;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
    }

    /* Hover: bring to foreground */
    .card:hover {
      z-index: 10;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);
    }

  </style>
